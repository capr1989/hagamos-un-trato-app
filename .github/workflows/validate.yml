name: Validate phase 1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  NEXT_TELEMETRY_DISABLED: "1"
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified through GitHub MCP
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
  supabase-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Start isolated local Supabase
        run: npm exec supabase -- start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - name: Rebuild the LOCAL database from versioned migrations
        run: npm run db:local:reset
      - run: npm run test:db:supabase-local
      - if: always()
        run: npm run db:local:stop
# No hosted link, deployment job, Supabase token, remote migration or public activation.
